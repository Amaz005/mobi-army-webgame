<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MobiArmy</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="play.css?v=@build.version@">
</head>
<body>
  <a id="home" href="/">← Cổng game</a>
  <script>if (window.top !== window.self) document.getElementById('home').hidden = true; /* inside the portal play page */</script>
  <main id="app">
    <canvas id="screen" width="240" height="320" tabindex="0" aria-label="Game screen"></canvas>
    <p id="status" role="status"></p>
    <div id="keypad" hidden></div>
    <p id="unsupported" hidden>
      This browser can't run the game. Please use a current Chrome, Edge or Firefox on a computer,
      or Chrome on Android.
    </p>
  </main>
  <script>
    (function () {
      var ok = !!(window.WebSocket && window.localStorage && document.createElement('canvas').getContext
        && window.Int8Array && window.URLSearchParams);
      window.mobiarmyStatus = function (text) {
        var s = document.getElementById('status');
        s.textContent = text;
        s.hidden = !text;
      };
      if (!ok) {
        document.getElementById('screen').hidden = true;
        document.getElementById('unsupported').hidden = false;
        return;
      }
      window.mobiarmyStatus('Loading…');
      var started = false;
      function start() {
        if (started) return;
        started = true;
        var s = document.createElement('script');
        s.src = 'client.js?v=@build.version@';
        s.onload = function () { main([]); };
        s.onerror = function () { window.mobiarmyStatus('Could not load the game. Check your connection and reload.'); };
        document.body.appendChild(s);
        document.getElementById('screen').focus();
      }
      // Logged in on the game portal? Get a one-time ticket so the game logs in by itself
      // (specs/004-game-portal research D15, web.AutoLogin). Never waits more than 3 s.
      setTimeout(start, 3000);
      fetch('/api/mobiarmy/ticket', { method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: '{}' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (t) { if (t && t.username && t.ticket && !started) window.mobiarmyAutoLogin = t; },
              function () {})
        .then(start);
    })();
  </script>
  <script src="keypad.js?v=@build.version@" defer></script>
</body>
</html>
