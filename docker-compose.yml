# One-command local stack: `docker compose up -d --build` (see README.md).
# Secrets come from .env (copy .env.example). The database is published on 127.0.0.1 only.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dbarmy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run only when pgdata is empty (first start or after `down -v`).
      - ./mobiarmy-java/dbarmy.sql:/docker-entrypoint-initdb.d/01-dbarmy.sql:ro
      - ./docker/db/02-game-user.sh:/docker-entrypoint-initdb.d/02-game-user.sh:ro
    ports:
      # This machine only (DB tools like psql/DBeaver); not reachable from the LAN or the internet.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      # TCP check: stays unhealthy during first-run init (which listens on the socket only).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d dbarmy"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build: ./mobiarmy-java
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db:5432
      DB_USER: army
      DB_DATABASE: dbarmy
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      # Portal session cookie gets "Secure" (set true when players use HTTPS: public mode or the tunnel).
      PORTAL_SECURE_COOKIE: ${PORTAL_SECURE_COOKIE:-false}
    ports:
      - "${GAME_PORT:-19149}:19149"
    # Portal API (specs/004-game-portal): reachable by the web container only, never published.
    expose:
      - "8081"
    volumes:
      # Game settings: edit, then `docker compose restart server` (no rebuild).
      - ./mobiarmy-java/army2.conf:/app/army2.conf:ro
    # unless-stopped (not on-failure): on DB errors the server exits with code 0.
    restart: unless-stopped
    stop_grace_period: 15s

  # --- Web client (spec 002-web-client). db/server never depend on these. ---

  relay:
    build: ./docker/relay
    depends_on:
      - server
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web-client/Dockerfile
    depends_on:
      - relay
    environment:
      WEB_MODE: ${WEB_MODE:-local}
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      WEB_MAX_CONN_PER_IP: ${WEB_MAX_CONN_PER_IP:-4}
      WEB_CONN_RATE: ${WEB_CONN_RATE:-10r/m}
      WEB_API_RATE: ${WEB_API_RATE:-30r/m}
    ports:
      - "${WEB_PORT:-8080}:8080"        # HTTP (local mode: the game; public mode: redirect + ACME)
      - "${WEB_TLS_PORT:-8443}:8443"    # HTTPS, public mode only
    volumes:
      - ./docker/web/nginx.${WEB_MODE:-local}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/web/certs:/etc/nginx/certs:ro
      - ./docker/web/acme:/var/www/acme:ro
      # Game portal (specs/004-game-portal): edit portal/games.json, then `docker compose restart web`.
      - ./portal:/usr/share/nginx/portal:ro
    networks:
      default: {}
      tunnel:
        # Pinned so Docker never hands web the address reserved for cloudflared (.2).
        ipv4_address: 172.29.252.3
    restart: unless-stopped

  # Cloudflare Tunnel (optional): enable with COMPOSE_PROFILES=tunnel and CLOUDFLARE_TUNNEL_TOKEN in .env.
  # Route the tunnel's public hostname to http://web:8080 (README › Cloudflare Tunnel).
  cloudflared:
    image: cloudflare/cloudflared:2025.4.0
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    networks:
      tunnel:
        # nginx trusts CF-Connecting-IP only from this address (docker/web/nginx.local.conf.template).
        ipv4_address: 172.29.252.2
    restart: unless-stopped

networks:
  default: {}
  # Only web and cloudflared. Its fixed address is what lets nginx tell tunnel traffic from direct traffic.
  tunnel:
    ipam:
      config:
        - subnet: 172.29.252.0/29

volumes:
  pgdata: {}
